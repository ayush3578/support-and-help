<!DOCTYPE html>
<html lang="en">
<head>
<title>Housizy Warehouse</title>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--cd:#fff;--tx:#1A1A1A;--mt:#6B7280;--br:#E5E7EB;
  --teal:#00796B;--td:#004D40;--amber:#E8A020;--red:#B71C1C;
  --grn:#2E7D32;--blu:#1565C0;--pur:#6A1B9A;--org:#E65100;
  --sbw:220px;
}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
/* LOGIN */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#003329,#004D40,#00796B)}
.lb{background:#fff;border-radius:20px;padding:40px 36px;width:420px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
/* LAYOUT */
.lay{display:flex;min-height:100vh}
.sb{width:var(--sbw);background:linear-gradient(180deg,#003329,#00574B);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200}
.sbl{padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbt{font-family:Manrope,sans-serif;font-size:19px;font-weight:900;color:#fff;letter-spacing:-0.5px}
.sbx{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.sbwh{display:inline-block;background:rgba(255,255,255,.15);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-top:5px;letter-spacing:.5px}
.sbn2{flex:1;overflow-y:auto;padding:6px 0;scrollbar-width:none}
.sbn2::-webkit-scrollbar{display:none}
.ns{font-size:9px;font-weight:700;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:1.2px;padding:12px 14px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;color:rgba(255,255,255,.65);font-size:12px;font-weight:600;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent;transition:all .12s}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.on{background:rgba(255,255,255,.14);color:#fff;border-left-color:var(--amber)}
.nb{margin-left:auto;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;background:#EF4444;color:#fff}
.nb.teal{background:var(--amber);color:#1A1A1A}
.sbft{padding:10px 14px;border-top:1px solid rgba(255,255,255,.1)}
/* MAIN */
.mn{margin-left:var(--sbw);flex:1;display:flex;flex-direction:column}
.tb{height:56px;background:#fff;border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:100}
.tbt{font-family:Manrope,sans-serif;font-size:17px;font-weight:900;flex:1}
/* SECTIONS */
.sec{display:none;padding:20px 22px}
.sec.on{display:block}
/* CARDS */
.card{background:var(--cd);border-radius:12px;border:1px solid var(--br);padding:16px}
/* KPI */
.kr{display:grid;gap:12px;margin-bottom:16px}
.r2{grid-template-columns:repeat(2,1fr)}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--cd);border-radius:12px;border:1px solid var(--br);padding:14px 16px;border-top:3px solid #ccc}
.kpi.T{border-top-color:var(--teal)}.kpi.R{border-top-color:var(--red)}.kpi.G{border-top-color:var(--grn)}
.kpi.A{border-top-color:var(--amber)}.kpi.B{border-top-color:var(--blu)}.kpi.O{border-top-color:var(--org)}
.kl{font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.kv{font-family:Manrope,sans-serif;font-size:24px;font-weight:900;line-height:1}
.ks{font-size:11px;color:var(--mt);margin-top:4px}
/* PILLS */
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
.pN{background:#FFF7ED;color:#C2410C}.pP{background:#EFF6FF;color:#1D4ED8}.pR{background:#F0FDF4;color:#166534}
.pD{background:#FAF5FF;color:#6B21A8}.pV{background:#ECFDF5;color:#065F46}
.pI{background:#FEF2F2;color:#991B1B}.pA{background:#FFFBEB;color:#92400E}
.pB{background:#EFF6FF;color:#1E40AF}.pG{background:#F9FAFB;color:#374151}
.pT{background:#E0F2F1;color:#00574B}.pO{background:#F3F4F6;color:#6B7280}
/* TABLES */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--br)}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#F9FAFB;font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;text-align:left;border-bottom:1px solid var(--br);white-space:nowrap}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #F5F7FA;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
/* BUTTONS */
.btn{padding:7px 14px;border:none;border-radius:8px;font-family:Manrope,sans-serif;font-size:12px;font-weight:800;cursor:pointer;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{filter:brightness(.92)}.btn:active{transform:scale(.97)}
.bT{background:var(--teal);color:#fff}.bR{background:var(--red);color:#fff}
.bG{background:var(--grn);color:#fff}.bA{background:var(--amber);color:#1A1A1A}
.bB{background:var(--blu);color:#fff}.bO{background:var(--org);color:#fff}
.bX{background:#F3F4F6;color:var(--tx);border:1px solid var(--br)}.bD{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5}
.bs{padding:4px 10px;font-size:11px;border-radius:6px}.bl{padding:11px 22px;font-size:14px}.bf{width:100%;justify-content:center}
/* FORMS */
.fg{margin-bottom:13px}
.fl{font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
.fi{width:100%;background:#F9FAFB;border:1.5px solid var(--br);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--tx);outline:none;font-family:Inter,sans-serif}
.fi:focus{border-color:var(--teal);background:#fff}
.fs{padding:5px 9px;font-size:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
/* MODALS */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.mo.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.msm{max-width:460px}.mmd{max-width:580px}.mlg{max-width:760px}
.mh{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--br);position:sticky;top:0;background:#fff}
.mtitle{font-family:Manrope,sans-serif;font-size:16px;font-weight:900}
.mx{width:28px;height:28px;border-radius:7px;background:#F3F4F6;border:none;cursor:pointer;font-size:14px}
.mbd{padding:16px 20px 20px}
/* MISC */
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-t{font-family:Manrope,sans-serif;font-size:15px;font-weight:900}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.ab{padding:9px 14px;border-radius:9px;margin-bottom:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.abR{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.abA{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.abG{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
.abT{background:#E0F2F1;color:#004D40;border:1px solid #80CBC4}
.abB{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}
.ch{height:220px;position:relative}
.pgb{height:6px;border-radius:3px;background:#F3F4F6;overflow:hidden}
.pgf{height:100%;border-radius:3px;transition:width .4s}
.srow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #F5F7FA}
.srow:last-child{border-bottom:none}
.sic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tgl{width:38px;height:20px;border-radius:10px;background:#D1D5DB;border:none;cursor:pointer;flex-shrink:0;transition:background .2s;position:relative}
.tgl.on{background:var(--teal)}
.tgl span{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.tgl.on span{left:21px}
.ld{width:7px;height:7px;border-radius:50%;background:#10B981;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* ORDER CARD — big tap-friendly workflow cards */
.ocard{background:#fff;border:1.5px solid var(--br);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.ocard:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);border-color:var(--teal)}
.ocard.urgent{border-left:4px solid var(--red)}
.ocard.ready{border-left:4px solid var(--grn)}
.ocard.dispatched{border-left:4px solid var(--pur)}
.ocard-id{font-family:Manrope,sans-serif;font-weight:900;font-size:15px;color:var(--teal)}
.ocard-cust{font-weight:700;font-size:14px;margin:2px 0}
.ocard-area{font-size:12px;color:var(--mt)}
.ocard-items{font-size:12px;color:var(--tx);margin:8px 0;padding:8px 10px;background:#F9FAFB;border-radius:8px;line-height:1.6}
.ocard-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
/* SCANNER AREA */
.scan-box{background:linear-gradient(135deg,#E0F2F1,#F9FAFB);border:2px dashed #80CBC4;border-radius:12px;padding:20px;text-align:center;margin-bottom:14px}
/* PRINT SLIP */
.slip{background:#fff;border:1px solid #ccc;border-radius:8px;padding:16px;font-size:12px;max-width:320px;margin:0 auto}
/* BADGE COUNTER */
.badge-cnt{background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:10px;margin-left:5px}
/* STATUS STEPS */
.steps{display:flex;gap:0;margin:14px 0}
.step{flex:1;text-align:center;position:relative}
.step::after{content:"";position:absolute;top:14px;right:-50%;width:100%;height:2px;background:#E5E7EB;z-index:0}
.step:last-child::after{display:none}
.step-dot{width:28px;height:28px;border-radius:50%;background:#E5E7EB;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;position:relative;z-index:1}
.step-dot.done{background:var(--teal);color:#fff}
.step-dot.active{background:var(--amber);color:#1A1A1A;box-shadow:0 0 0 3px #FDE68A}
.step-lbl{font-size:10px;font-weight:700;color:var(--mt)}
.step-lbl.done{color:var(--teal)}.step-lbl.active{color:var(--org);font-weight:800}
#toast{position:fixed;bottom:20px;right:20px;background:#1A1A1A;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:9999}
#toast.on{opacity:1}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:2px}
</style>

function launch(){
  document.getElementById('lp').style.display='none';document.getElementById('app').style.display='flex';
  document.getElementById('sb-wh-name').textContent=CW.whId+' \u2014 '+CW.whNm;
  document.getElementById('sb-staff-name').textContent=CW.staffNm;
  document.getElementById('sb-staff-role').textContent={owner:'Owner/Manager',supervisor:'Supervisor',picker:'Picker'}[CW.role]||CW.role;
  document.getElementById('tb-wh-badge').textContent=CW.whId+' \u2014 '+CW.whNm;
  buildNav();show('dash');
  setInterval(function(){document.getElementById('tbc').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);
  setInterval(function(){ORDERS.forEach(function(o){if(o.st==='New'||o.st==='Packing')o.age++;});updBadges();},60000);
  alog('Logged in','Auth');
}
function buildNav(){
  var h='',lg='';
  NAV.forEach(function(n){
    if(n.grp!==lg){h+='<div class="ns">'+n.grp+'</div>';lg=n.grp;}
    var bd='';
    if(n.badge==='new')bd='<span class="nb" id="bdg-new">'+cN()+'</span>';
    else if(n.badge==='pack')bd='<span class="nb" style="background:#3B82F6" id="bdg-pack">'+cP()+'</span>';
    else if(n.badge==='ready')bd='<span class="nb nb-grn" id="bdg-ready">'+cR()+'</span>';
    h+='<button class="ni" id="ni-'+n.id+'" onclick="show(\''+n.id+'\')"><span class="ni-ic">'+n.ic+'</span>'+n.l+bd+'</button>';
  });
  document.getElementById('snav').innerHTML=h;
}

  el.innerHTML='<div class="sbar" id="q-bar">'+sts.map(function(s,i){var cnt=s==='All'?ORDERS.length:ORDERS.filter(function(o){return o.st===s;}).length;return '<div class="sbar-seg '+(i===0?'on':'')+'" onclick="fQ(\''+s+'\',this)">'+s+' ('+cnt+')</div>';}).join('')+'</div>'

    +'</div><div id="q-list">'+qCards(ORDERS)+'</div>';

function qCards(list){
  if(!list.length)return '<div style="text-align:center;padding:40px;color:var(--mt)">No orders</div>';
  return list.map(function(o){
    var sc={New:'oc new',Packing:'oc pack',Ready:'oc ready',Dispatched:'oc',Delivered:'oc'}[o.st]||'oc';
    var ab='';
    if(o.st==='New')ab='<button onclick="event.stopPropagation();sPack(\''+o.id+'\')" class="btn bT bs">\ud83d\udce6 Start Pack</button>';
    else if(o.st==='Packing')ab='<button onclick="event.stopPropagation();openPack(\''+o.id+'\')" class="btn bB bs">\u2705 Checklist</button>';
    else if(o.st==='Ready')ab='<button onclick="event.stopPropagation();openDisp(\''+o.id+'\')" class="btn bG bs">\ud83d\ude9b Dispatch</button>';
    return '<div class="'+sc+'" onclick="oOrd(\''+o.id+'\')">'
      +'<div class="oc-hdr"><span class="oc-id">'+o.id+'</span>'+(o.priority==='high'?'<span class="pri-high">HIGH</span>':'<span class="pri-med">MED</span>')+sp(o.st)+ageTimer(o.age)+'<span class="oc-time">'+o.time+'</span></div>'
      +'<div class="oc-items">'+o.items.map(function(i){return '<span style="background:#F0F4F3;border-radius:6px;padding:2px 8px;margin-right:5px;font-size:12px">'+i.nm+' \xd7'+i.qty+' <strong style="color:var(--teal)">('+i.loc+')</strong></span>';}).join('')+'</div>'
      +'<div class="oc-ft"><div><div style="font-weight:700">'+o.cust+'</div><div style="font-size:11px;color:var(--mt)">\ud83d\udccd '+o.area+' \xb7 \ud83d\udcde '+o.ph+'</div></div>'
      +'<span class="pill '+(o.pay==='COD'?'pA':'pT')+'">'+o.pay+'</span>'
      +'<span style="font-family:Manrope,sans-serif;font-weight:900;color:var(--teal);font-size:15px">'+f(o.total)+'</span>'
      +(o.notes?'<span style="font-size:11px;color:var(--red)">\u26a0 '+o.notes+'</span>':'')
      +'<div style="margin-left:auto">'+ab+'</div></div></div>';
  }).join('');
}
function fQ(s,btn){document.querySelectorAll('.sbar-seg').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');document.getElementById('q-list').innerHTML=qCards(s==='All'?ORDERS:ORDERS.filter(function(o){return o.st===s;}));}
function sQ(q){var lq=q.toLowerCase();document.getElementById('q-list').innerHTML=qCards(ORDERS.filter(function(o){return !q||o.id.toLowerCase().includes(lq)||(o.cust||'').toLowerCase().includes(lq);}));}

function sPack(id){var o=ORDERS.find(function(x){return x.id===id;});if(!o)return;o.st='Packing';o.pickedBy=CW.staffNm||'Staff';updBadges();if(document.getElementById('s-pack').classList.contains('on'))RF['pack']();if(document.getElementById('s-queue').classList.contains('on'))RF['queue']();toast(id+' packing started','#1565C0');alog('Started packing: '+id,'Orders');}
function openPack(id){
  var o=ORDERS.find(function(x){return x.id===id;});if(!o)return;
  document.getElementById('mo-pack-t').textContent='\ud83d\udce6 Pack: '+id;
  document.getElementById('mo-pack-b').innerHTML=
    '<div class="ab abT" style="margin-bottom:12px">'+o.cust+' \xb7 '+o.area+(o.notes?'<br>\u26a0 <strong>'+o.notes+'</strong>':'')+'</div>'

    +o.items.map(function(it,i){return '<div class="chk-item" id="chk-'+i+'" onclick="tChk('+i+')">'
      +'<input type="checkbox" id="chkb-'+i+'" onclick="event.stopPropagation();tChk('+i+')">'
      +'<div style="flex:1"><div style="font-weight:700;font-size:14px">'+it.nm+'</div>'
      +'<div style="font-size:12px;color:var(--mt)">Qty: <strong>'+it.qty+' '+it.unit+'</strong> \xb7 Location: <strong style="color:var(--teal)">'+it.loc+'</strong></div></div>'
      +'<span style="font-size:20px" id="chk-ic-'+i+'">&#9744;</span></div>';}).join('')
    +'<div style="display:flex;gap:8px;margin-top:14px">'
    +'<button onclick="cm(\'mo-pack\')" class="btn bX" style="flex:1">Cancel</button>'
    +'<button onclick="mrkPacked(\''+id+'\')" class="btn bT" style="flex:2">\u2705 Mark Packed & Ready</button></div>';

    RF['returns']();toast(r.item+' \xd7'+r.qty+' restocked to inventory \u2713','#2E7D32');

  } else {
    toast('Item "'+r.item+'" not found in inventory. Check item name.','#B71C1C');
  }

function dispose(id){
  var r=RETURNS_LOG.find(function(x){return x.id===id;});if(!r)return;
  r.st='Disposed';

  RF['returns']();toast(r.item+' \xd7'+r.qty+' disposed & written off \u2713','#B71C1C');

}

// ═══ PERFORMANCE ═══
RF['perf']=function(){
  var el=document.getElementById('s-perf');
  var totalOrders=ORDERS.length;
  var fulfilled=ORDERS.filter(function(o){return o.st==='Dispatched'||o.st==='Delivered';}).length;
  var onTime=ORDERS.filter(function(o){return o.age<=30&&(o.st==='Dispatched'||o.st==='Delivered'||o.st==='Ready');}).length;
  var onTimePct=totalOrders>0?Math.round(onTime/totalOrders*100):0;
  var packed=ORDERS.filter(function(o){return o.packed;}).length;
  var packAcc=totalOrders>0?(packed/totalOrders*100).toFixed(1):0;
  var rev=ORDERS.filter(function(o){return o.st==='Dispatched'||o.st==='Delivered';}).reduce(function(a,o){return a+o.total;},0);
  var totalTrips=DRIVERS.reduce(function(a,d){return a+d.trips;},0);
  el.innerHTML='<div class="kr r4" style="margin-bottom:16px">'
    +'<div class="kpi T"><div class="kl">Total Orders</div><div class="kv" style="color:var(--teal)">'+totalOrders+'</div><div class="ks">'+fulfilled+' fulfilled</div></div>'
    +'<div class="kpi G"><div class="kl">On-time Dispatch</div><div class="kv" style="color:var(--grn)">'+onTimePct+'%</div><div class="ks">within 30 min SLA</div></div>'
    +'<div class="kpi A"><div class="kl">Packing Accuracy</div><div class="kv" style="color:var(--amb)">'+packAcc+'%</div></div>'
    +'<div class="kpi B"><div class="kl">Revenue Processed</div><div class="kv" style="color:var(--blu);font-size:18px">'+f(rev)+'</div></div>'
    +'</div>'
    +'<div class="g2" style="margin-bottom:16px">'
    +'<div class="card"><div class="sh"><div class="sh-t">Orders by Day</div></div><div class="ch"><canvas id="c-ord"></canvas></div></div>'
    +'<div class="card"><div class="sh"><div class="sh-t">Category Split</div></div><div class="ch"><canvas id="c-cat"></canvas></div></div>'
    +'</div>'
    +'<div class="g2">'
    +'<div class="card"><div class="sh"><div class="sh-t">Driver Performance</div></div>'
    +'<div class="tw"><table><thead><tr><th>Driver</th><th>Trips</th><th>On-time</th><th>Earned</th></tr></thead><tbody>'
    +DRIVERS.map(function(d){var otPct=d.trips>0?Math.min(100,Math.round(90+Math.random()*10)):0;return '<tr><td style="font-weight:700">'+d.nm+'</td><td>'+d.trips+'</td><td><span class="pill '+(otPct>=90?'pT':otPct>=75?'pA':'pI')+'">'+otPct+'%</span></td><td style="color:var(--teal);font-weight:700">'+f(d.earn)+'</td></tr>';}).join('')
    +'</tbody></table></div></div>'
    +'<div class="card"><div class="sh"><div class="sh-t">Staff Productivity</div></div>'
    +'<div class="tw"><table><thead><tr><th>Staff</th><th>Role</th><th>Tasks</th><th>Score</th></tr></thead><tbody>'
    +STAFF.map(function(s){return '<tr><td style="font-weight:700">'+s.nm+'</td><td>'+s.role+'</td><td>'+s.tasks+'</td><td><span style="font-weight:700;color:'+(s.perf>85?'var(--grn)':s.perf>70?'var(--amb)':'var(--red)')+'">'+s.perf+'%</span></td></tr>';}).join('')
    +'</tbody></table></div></div></div>';
  setTimeout(function(){
    mch('c-ord','bar',{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{data:[18,22,19,25,21,28,16],backgroundColor:['#B2DFDB','#B2DFDB','#B2DFDB','#B2DFDB','#B2DFDB','#00695C','#B2DFDB'],borderRadius:5,borderSkipped:false}]},{scales:{y:{grid:{color:'#F5F5F5'}},x:{grid:{display:false}}}});
    mch('c-cat','doughnut',{labels:['Cement','Wire','Electrical','Tiles','Plywood'],datasets:[{data:[40,20,22,10,8],backgroundColor:['#80CBC4','#4DD0E1','#81D4FA','#B2DFDB','#B2EBF2'],borderWidth:1}]},{plugins:{legend:{display:true,position:'right',labels:{font:{size:11}}}}});
  },80);
};

function svSet(){
  var el=document.getElementById('s-settings');
  var inputs=el.querySelectorAll('input,textarea');
  var w=WH_DATA[CW.whId||'WH-001'];
  // inputs order: name, owner, phone, address, openTime, closeTime, cap, racks
  if(inputs[0])w.nm=inputs[0].value.trim()||w.nm;
  if(inputs[1])w.own=inputs[1].value.trim()||w.own;
  if(inputs[2])w.ownPh=inputs[2].value.trim()||w.ownPh;
  if(inputs[3])w.addr=inputs[3].value.trim()||w.addr;
  if(inputs[4])w.openTime=inputs[4].value||w.openTime;

  document.getElementById('sb-staff-name').textContent=w.own;
  document.getElementById('tb-wh-badge').textContent=CW.whId+' \u2014 '+w.nm;
  toast('Settings saved \u2713','#2E7D32');alog('Settings updated','Settings');
}
function svLayout(){
  var w=WH_DATA[CW.whId||'WH-001'];
  var el=document.getElementById('s-settings');
  var capInput=el.querySelector('input[type="number"][aria-label="Cap"]');
  var rackInput=el.querySelector('input[type="number"][aria-label="Racks"]');

  if(rackInput)w.racks=parseInt(rackInput.value)||6;
  toast('Layout saved \u2713','#2E7D32');alog('Layout updated','Settings');
}
